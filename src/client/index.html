<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>视频对话文章</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="brand">视频对话文章</p>
        <p class="lede">输入一个带字幕的 YouTube 视频链接，生成按章节组织的中文对话文章。全文生成后，可以查看每一章的 5W1H 总结。</p>
      </header>

      <form id="generate-form" class="composer" novalidate>
        <div class="field">
          <div class="field-head">
            <label class="field-label" for="video-url">YouTube 链接</label>
            <button id="fill-sample" type="button" class="link-button">填入示例视频</button>
          </div>
          <input id="video-url" name="url" type="url" required autocomplete="off" placeholder="https://www.youtube.com/watch?v=…" />
        </div>
        <label class="field">
          <span class="field-label">生成要求 <span class="optional">可选</span></span>
          <textarea id="instructions" name="instructions" rows="3" maxlength="1000" autocomplete="off" placeholder="例如：写给不懂技术的投资人，只保留商业相关的内容，语言简洁。"></textarea>
        </label>
        <div class="actions">
          <button id="stop" type="button" class="secondary" hidden>停止生成</button>
          <button id="submit" type="submit" class="primary">生成文章</button>
        </div>
      </form>

      <div id="status" class="status" role="status" aria-live="polite" hidden></div>

      <section id="source" class="source-panel" aria-label="来源信息" hidden></section>

      <article id="article" class="article" aria-live="off"></article>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
